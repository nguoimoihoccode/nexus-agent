[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-ai-trader-worker"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.142.2,<1",
    "httpx>=0.28.1,<0.29",
    "pydantic>=2.13.5,<3",
    "uvicorn[standard]>=0.54.0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
