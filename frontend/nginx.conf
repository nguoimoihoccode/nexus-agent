limit_req_zone $binary_remote_addr zone=nexus_api:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=nexus_conn:10m;
log_format nexus_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
map $request_uri $nexus_cache_control {
    ~^/api(?:/|$) "";
    ~^/auth(?:/|$) "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
    default "no-cache";
}
server_tokens off;
access_log /var/log/nginx/access.log nexus_safe;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 128k;

    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; frame-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; script-src 'self'; script-src-attr 'none'; object-src 'none'; worker-src 'none'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header Content-Security-Policy-Report-Only "require-trusted-types-for 'script'; trusted-types 'none'; report-uri /auth/csp-report" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control $nexus_cache_control always;

    location /api/ {
        limit_req zone=nexus_api burst=20 nodelay;
        limit_conn nexus_conn 10;
        proxy_pass ${NGINX_BACKEND_UPSTREAM}/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api {
        return 308 /api/;
    }

    location /auth/ {
        limit_req zone=nexus_api burst=10 nodelay;
        limit_conn nexus_conn 5;
        client_max_body_size 16k;
        proxy_pass ${NGINX_BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/(ui|mcp|a2a|docs|redoc|openapi\.json|info|metrics) {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
