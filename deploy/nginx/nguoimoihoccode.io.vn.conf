# Host ingress for the Nexus demo.
#
# Terminates TLS and authenticates before anything reaches the application,
# then proxies to the loopback-bound frontend container. The container itself
# only listens on 127.0.0.1:8080, so this file is the only public way in.
#
# Why basic auth is here and not optional: the demo runs the backend in
# development mode, where every request is granted the development admin
# identity (backend/source/security/auth.py) and /auth/login redirects straight
# to /chat (backend/source/http_app.py). Without a gate, anyone who reaches the
# hostname has admin access. Remove this block only after the private-beta OIDC
# profile is what is actually deployed.
#
# Install:
#   cp deploy/nginx/nguoimoihoccode.io.vn.conf /etc/nginx/conf.d/
#   htpasswd -c /etc/nginx/nexus-demo.htpasswd <user>
#   nginx -t && systemctl reload nginx
#
# HTTP/2 is left off so this file loads on any nginx. Add `http2 on;` inside
# the 443 server block on nginx 1.25.1+, or use `listen 443 ssl http2;` on
# older releases.

server {
    listen 80;
    listen [::]:80;
    server_name nguoimoihoccode.io.vn;

    # Certbot's HTTP-01 challenge, which must stay unauthenticated.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nguoimoihoccode.io.vn;

    ssl_certificate     /etc/letsencrypt/live/nguoimoihoccode.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nguoimoihoccode.io.vn/privkey.pem;

    # Enable only once HTTPS is confirmed working for the complete hostname.
    # HSTS is remembered by browsers for its whole max-age, so a broken
    # certificate after enabling it locks the domain out for that long.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # The demo gate. `auth_basic_user_file` must be readable by the nginx
    # worker user and is expected to be mode 640 root:www-data.
    auth_basic "Nexus demo";
    auth_basic_user_file /etc/nginx/nexus-demo.htpasswd;

    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";

        # Agent responses stream server-sent events, so buffering is off and the
        # read timeout is long enough for a slow model turn.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}