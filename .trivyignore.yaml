vulnerabilities:
  - id: CVE-2026-84445
    paths:
      - app/datadog-init
    expired_at: 2027-01-15
    statement: >-
      Temporary exception owned by the Nexus platform/security maintainer. This
      gRPC-Go denial of service sits in the Datadog init wrapper that
      langchain/langgraph-api:3.11 runs ahead of uvicorn, and Datadog links that
      binary statically, so this repository cannot rebuild it. The previous
      exception, CVE-2026-39822, was retired by moving the base image to the
      digest published for this tag. Re-check on the next base image bump and
      drop this entry once that build carries google.golang.org/grpc 1.83.2 or
      newer.
