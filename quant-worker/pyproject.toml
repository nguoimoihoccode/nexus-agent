[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-quant-worker"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "numpy>=1.24,<2",
    "pandas>=1.5,<3",
    "psycopg[binary,pool]>=3.3.4,<4",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
qlib = [
    "catboost>=1.2,<2",
    "mlflow>=3.11,<4",
    "pyarrow>=23.0.1,<24",
    "pyqlib==0.9.7",
    "scikit-learn>=1.4,<2",
    "scipy>=1.10,<2",
    "xgboost>=2,<4",
]
dev = [
    "httpx>=0.28,<0.29",
    "pyqlib==0.9.7",
    "pytest>=9.0.3,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
