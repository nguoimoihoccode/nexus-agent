[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-agent"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "cryptography>=46,<50",
    "deepagents>=0.6.11,<0.7",
    "fastapi>=0.115,<1",
    "httpx>=0.28.1,<0.29",
    "langchain-deepseek>=1.1.0,<2",
    "langgraph-checkpoint-postgres>=3.1.0,<4",
    "pyjwt[crypto]>=2.10.1,<3",
    "pycryptodome>=3.23.0,<4",
    "pydantic-settings>=2.14.2,<3",
    "psycopg[binary,pool]>=3.3.4,<4",
]

[project.optional-dependencies]
dev = [
    "langgraph-cli[inmem]>=0.4.30,<0.5",
    "setuptools>=83,<84",
    "starlette>=1.3.1,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["source"]
