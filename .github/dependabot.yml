version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /backend
      - /ai-trader-worker
      - /quant-data-worker
      - /quant-worker
    schedule:
      interval: weekly
      day: monday
      time: "03:47"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 8
    # pyarrow is held at its current major because mlflow caps it. mlflow 3.17.0
    # is the newest release and requires pyarrow>=4.0.0,<26, while Dependabot
    # proposed pyarrow>=26.0.0,<27 for quant-worker. That pair has no solution at
    # all: `uv lock` fails with "your project's requirements are unsatisfiable",
    # which takes every job that runs `uv sync --locked` down with it. Patch and
    # minor pyarrow releases inside the current major still arrive normally, and
    # the ceiling can be lifted once mlflow widens its range.
    ignore:
      - dependency-name: pyarrow
        update-types:
          - version-update:semver-major
    groups:
      python-dependencies:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "04:02"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    groups:
      frontend-dependencies:
        patterns:
          - "*"
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
      - /ai-trader-worker
      - /quant-data-worker
      - /quant-worker
    schedule:
      interval: weekly
      day: monday
      time: "04:17"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    # These three runtime images are held at their current major on purpose, so
    # Dependabot asks for the next one as a deliberate migration rather than
    # folding it into a routine weekly bump. Patch and minor releases inside
    # the current major still arrive normally.
    #
    # python: all four pyproject files pin requires-python to >=3.11,<3.12 and
    # the backend's runtime image is langchain/langgraph-api:3.11. Dependabot
    # proposed exactly that jump as python:3.11 -> python:3.14, and every image
    # that carries a uv sync step stopped building with "No interpreter found
    # for Python ==3.11.*".
    #
    # node and nginx: they back the frontend build and the server that serves
    # it, so a major jump moves the platform the app is compiled and served on.
    # They follow the same rule the postgres image already has in the
    # docker-compose ecosystem below.
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
      - dependency-name: node
        update-types:
          - version-update:semver-major
      - dependency-name: nginx
        update-types:
          - version-update:semver-major
    groups:
      application-base-images:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:47"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:32"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: postgres
        update-types:
          - version-update:semver-major
    groups:
      beta-runtime-images:
        patterns:
          - "*"
