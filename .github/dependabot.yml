version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /backend
      - /ai-trader-worker
      - /quant-data-worker
      - /quant-worker
    schedule:
      interval: weekly
      day: monday
      time: "03:47"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 8
    # pyarrow is held at its current major because mlflow caps it. mlflow 3.17.0
    # is the newest release and requires pyarrow>=4.0.0,<26, while Dependabot
    # proposed pyarrow>=26.0.0,<27 for quant-worker. That pair has no solution at
    # all: `uv lock` fails with "your project's requirements are unsatisfiable",
    # which takes every job that runs `uv sync --locked` down with it. Patch and
    # minor pyarrow releases inside the current major still arrive normally, and
    # the ceiling can be lifted once mlflow widens its range.
    ignore:
      - dependency-name: pyarrow
        update-types:
          - version-update:semver-major
    groups:
      python-dependencies:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "04:02"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    groups:
      frontend-dependencies:
        patterns:
          - "*"
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
      - /ai-trader-worker
      - /quant-data-worker
      - /quant-worker
    schedule:
      interval: weekly
      day: monday
      time: "04:17"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    # These three runtime images are held where they are on purpose, so
    # Dependabot asks for the next one as a deliberate migration rather than
    # folding it into a routine weekly bump. Digest refreshes and updates inside
    # the pinned series still arrive normally.
    #
    # The pin is written as an explicit `versions` range rather than
    # `update-types: semver-major`, because these tags carry only two components
    # and Dependabot reads a two-component tag as major.minor. It classifies
    # python 3.11 -> 3.14 and nginx 1.27 -> 1.31 as *minor* jumps, so a
    # semver-major rule never matches them. The earlier semver-major rules here
    # were no-ops, which is how the 3.14 and 1.31 bumps still reached a pull
    # request. See the dependabot options reference on `versions` versus
    # `update-types`.
    #
    # python: all four pyproject files pin requires-python to >=3.11,<3.12 and
    # the backend's runtime image is langchain/langgraph-api:3.11. Every image
    # that carries a uv sync step fails to build on python 3.14 with "No
    # interpreter found for Python ==3.11.*".
    #
    # node and nginx: they back the frontend build and the server that serves
    # it, so a jump moves the platform the app is compiled and served on.
    ignore:
      - dependency-name: python
        versions:
          - ">=3.12"
      - dependency-name: node
        versions:
          - ">=23"
      - dependency-name: nginx
        versions:
          - ">=1.28"
    groups:
      application-base-images:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:47"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:32"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: postgres
        update-types:
          - version-update:semver-major
    groups:
      beta-runtime-images:
        patterns:
          - "*"
