name: Regenerate lockfiles

# Dependabot's pip ecosystem edits pyproject.toml and never uv.lock, so a pull
# request it opens leaves the lockfile stale and takes down every job that runs
# `uv sync --locked`. This workflow resolves the bumped manifests and pushes the
# regenerated locks back onto the Dependabot branch.
#
# Two GitHub behaviours shape the design, and both are worth knowing before
# editing this file:
#
#   1. A run triggered by Dependabot gets a read-only GITHUB_TOKEN unless the
#      workflow asks for more, which is why `contents: write` is declared below.
#      Because this job writes to the repository, it is gated on the Dependabot
#      actor, and the workflow definition itself is read from the base branch,
#      so nothing on the pull request can alter what runs here.
#
#   2. A push authenticated with GITHUB_TOKEN never starts another workflow run,
#      by design, to stop loops. The lock commit lands, but no check is
#      scheduled for it, so the pull request sits at "Expected — Waiting for
#      status to be reported" until a maintainer closes and reopens it. Do not
#      reach for `@dependabot rebase` at that point: a rebase force-pushes the
#      branch from Dependabot's own generated state and drops the lock commit
#      this workflow added, which puts the pull request back where it started.
#
# Lifting behaviour 2 needs a personal access token or a GitHub App token in
# `actions/checkout`, at the cost of a credential to create and rotate. The
# alternative that avoids both behaviours entirely is Dependabot's native `uv`
# ecosystem, which updates pyproject.toml and uv.lock together in its own
# commit; it cannot run alongside the pip entry for the same directories
# without opening duplicate pull requests.

on:
  pull_request:
    paths:
      - "**/pyproject.toml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  UV_VERSION: 0.10.6
  UV_HTTP_TIMEOUT: 300

jobs:
  lock:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
          enable-cache: true
      - name: Resolve every manifest
        run: |
          for package in backend ai-trader-worker quant-data-worker quant-worker; do
            echo "::group::uv lock in $package"
            (cd "$package" && uv lock)
            echo "::endgroup::"
          done
      - name: Push regenerated lockfiles
        run: |
          if git diff --quiet -- '*/uv.lock'; then
            echo "Lockfiles already match the manifests."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*/uv.lock'
          git commit -m "Regenerate lockfiles"
          git push
