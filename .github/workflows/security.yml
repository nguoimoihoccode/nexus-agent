name: Product security gate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_HTTP_TIMEOUT: 300

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.10.6
          python-version: "3.11"
          enable-cache: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.71.0
          cache: true
      - name: Scan complete Git history for secrets
        run: >-
          docker run --rm
          --volume "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --no-banner --redact
          --gitleaks-ignore-path=/repo/.gitleaksignore
      - name: Run security gate
        run: ./scripts/security-audit.sh

  frontend-dast:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Build production frontend boundary
        run: >-
          docker build
          --secret id=host_ca,src=/etc/ssl/certs/ca-certificates.crt
          -f frontend/Dockerfile -t nexus-frontend-dast .
      - name: Start production frontend boundary
        run: |
          docker run -d --name nexus-frontend-dast \
            --read-only \
            --network host \
            --env NGINX_BACKEND_UPSTREAM=http://127.0.0.1:19000 \
            --tmpfs /tmp:size=64m,uid=101,gid=101,mode=1777 \
            --tmpfs /etc/nginx/conf.d:size=16m,uid=101,gid=101,mode=0755 \
            --tmpfs /var/cache/nginx:size=64m,uid=101,gid=101,mode=0755 \
            nexus-frontend-dast
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs nexus-frontend-dast
          exit 1
      - name: Run OWASP ZAP baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://127.0.0.1:8080
          docker_name: ghcr.io/zaproxy/zaproxy:stable@sha256:8d387b1a63e3425beef4846e39719f5af2a787753af2d8b6558c6257d7a577a2
          rules_file_name: .zap/frontend-rules.tsv
          cmd_options: -m 1
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-frontend-${{ github.run_id }}
      - name: Stop DAST target
        if: always()
        run: docker rm -f nexus-frontend-dast >/dev/null 2>&1 || true
